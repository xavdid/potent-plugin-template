[project]
name = "potent-example"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "David Brownman", email = "oss@xavd.id" }]
requires-python = ">=3.12"
dependencies = ["potent>=0.10.0"]

[project.entry-points.potent]
